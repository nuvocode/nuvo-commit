name: Publish VS Code Extension

# Release = push a `vX.Y.Z` tag whose version matches package.json (see PUBLISHING.md).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub Release

jobs:
  publish:
    name: Publish Extension
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Check tag matches package.json
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$VERSION" ]; then
            echo "::error::Tag $VERSION does not match package.json version $pkg"
            exit 1
          fi

      - name: Extract release notes
        run: |
          # This version's CHANGELOG section, without its own heading.
          awk -v v="${VERSION#v}" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            found
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::error::No CHANGELOG.md section for ${VERSION#v}"
            exit 1
          fi

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test:unit

      - name: Package Extension
        run: npx --yes @vscode/vsce package --no-yarn -o "nuvo-commit-$VERSION.vsix"

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce publish --packagePath "nuvo-commit-$VERSION.vsix" --skip-duplicate

      - name: Publish to Open VSX Registry
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx publish "nuvo-commit-$VERSION.vsix" --pat "$OVSX_PAT" --skip-duplicate

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "nuvo-commit-$VERSION.vsix" --clobber
          else
            gh release create "$VERSION" "nuvo-commit-$VERSION.vsix" --title "$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          fi
